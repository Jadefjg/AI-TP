# AI-TP — 本地开发/调试（Mac / Windows / Linux）
#
# 首次：
#   cp deploy/.env.docker.local.example deploy/.env.docker
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# 访问：http://127.0.0.1:8088/
#
# 与旧版 ai-tp-local 项目名不同：统一为 ai-tp，避免与已有栈抢 8088/3307/6380 端口。

# Overlay only — Compose 2.24+ cannot override services imported via include.
# Use: docker compose -f docker-compose.yml -f docker-compose.local.yml ...

services:
  api:
    build:
      args:
        DEBIAN_MIRROR: mirrors.aliyun.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  web:
    build:
      args:
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
