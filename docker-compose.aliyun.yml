# AI-TP — 阿里云 ECS / 生产单实例（叠加在 docker-compose.yml 上）
#
# 首次：
#   cp deploy/.env.docker.aliyun.example deploy/.env.docker
#   docker compose -f docker-compose.yml -f docker-compose.aliyun.yml \
#     --env-file deploy/.env.docker up -d --build
# 或：./deploy/scripts/aliyun-deploy.sh
#
# 默认复用 /opt/shared-infra（不要再起 MySQL/Redis）：
#   ./deploy/scripts/aliyun-deploy.sh
# 需 Playwright/k6：
#   ./deploy/scripts/aliyun-deploy.sh --worker-tools
#
# Compose 2.24+ 禁止在 include 文件里覆盖已导入的 service，因此本文件是纯 overlay，
# 必须与 docker-compose.yml 一起用 -f，不要单独 -f docker-compose.aliyun.yml。

services:
  mysql:
    image: mysql:8.0
    ports: !reset []
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=96M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=50
      - --skip-mysqlx
    mem_limit: 256m

  redis:
    ports: !reset []
    mem_limit: 64m

  api:
    mem_limit: 384m
    build:
      args:
        DEBIAN_MIRROR: mirrors.aliyun.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    environment:
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED:-true}

  worker:
    mem_limit: 384m
    environment:
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED:-true}

  web:
    mem_limit: 64m
    build:
      args:
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
