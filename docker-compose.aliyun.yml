# AI-TP — 阿里云 ECS / 生产单实例
#
# 首次：
#   cp deploy/.env.docker.aliyun.example deploy/.env.docker
#   docker compose -f docker-compose.aliyun.yml up -d --build
# 或：./deploy/scripts/aliyun-deploy.sh
#
# 需 Playwright/k6：docker compose -f docker-compose.aliyun.yml -f compose.worker-tools.yml up -d --build

name: ai-tp

include:
  - docker-compose.yml

services:
  mysql:
    image: mysql:8.0
    ports: !reset []
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=96M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=50
      - --skip-mysqlx
    mem_limit: 256m

  redis:
    ports: !reset []
    mem_limit: 64m

  api:
    mem_limit: 384m
    build:
      args:
        DEBIAN_MIRROR: mirrors.aliyun.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    environment:
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED:-true}

  worker:
    mem_limit: 384m
    environment:
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED:-true}

  web:
    mem_limit: 64m
    build:
      args:
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
