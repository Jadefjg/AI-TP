[project]
name = "ai-tp"
version = "0.8.0"
description = "AI-assisted testing platform: case generation, multi-type test runs, reports, notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "pyyaml>=6.0.2",
  "fpdf2>=2.8.0",
  "alembic>=1.14.0",
  "python-docx>=1.1.2",
  "pypdf>=5.1.0",
  "cryptography>=43.0.0",
  "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0", "prometheus-client>=0.21.0"]
mysql = ["pymysql>=1.1.0", "cryptography>=43.0.0"]
redis = ["redis>=5.2.0"]
worker = ["redis>=5.2.0", "rq>=2.0.0", "celery[redis]>=5.4.0"]
billing = ["stripe>=11.0.0"]
observability = [
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
