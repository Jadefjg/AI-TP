# 接入公共 MySQL/Redis（/opt/shared-infra 的 shared-mysql / shared-redis）
# 本 overlay 会停用 compose 内的 mysql/redis，避免再起一套中间件。
#   ./deploy/scripts/aliyun-deploy.sh
#   docker compose -f docker-compose.yml -f docker-compose.aliyun.yml -f compose.shared.yml up -d

services:
  mysql:
    profiles: ["isolated-middleware"]

  redis:
    profiles: ["isolated-middleware"]

  api:
    mem_limit: 320m
    depends_on: !reset []
    environment:
      MYSQL_HOST: shared-mysql
      REDIS_URL: redis://shared-redis:6379/0
    networks:
      - default
      - shared-infra

  worker:
    mem_limit: 256m
    depends_on: !reset
      api:
        condition: service_healthy
    environment:
      MYSQL_HOST: shared-mysql
      REDIS_URL: redis://shared-redis:6379/0
    networks:
      - default
      - shared-infra

  web:
    mem_limit: 48m

networks:
  shared-infra:
    external: true
    name: shared-infra
