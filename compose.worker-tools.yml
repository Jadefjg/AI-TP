# 可选：Playwright + k6 + nuclei Worker（首次构建约 15–30 分钟）
#   docker compose -f docker-compose.local.yml -f compose.worker-tools.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.aliyun.yml -f compose.worker-tools.yml up -d --build

services:
  worker:
    image: ${AI_TP_WORKER_IMAGE:-ai-tp-worker:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker-tools
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
