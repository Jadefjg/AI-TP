server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    # Container listens on :80 while the host publishes another port (e.g. 8088).
    # Absolute redirects would send the browser to host :80 (another stack).
    absolute_redirect off;

    # Hashed build artifacts — never SPA-fallback (would return index.html as JS).
    location /assets/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate entry HTML so chunk hashes stay in sync after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api {
        return 301 /api/;
    }

    # Frontend uses VITE_API_BASE_URL=/api → strip prefix to FastAPI root
    location /api/ {
        proxy_pass http://api:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Optional: expose metrics only on internal networks in production
    location /metrics {
        proxy_pass http://api:8002/metrics;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Swagger UI (served at /api/docs) requests /openapi.json on the same origin.
    location = /openapi.json {
        proxy_pass http://api:8002/openapi.json;
        proxy_set_header Host $http_host;
    }
}
