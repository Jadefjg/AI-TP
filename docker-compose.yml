# AI-TP unified Docker Compose — local + Aliyun ECS
#
# Local:
#   cp deploy/.env.docker.local.example deploy/.env.docker
#   ./deploy/scripts/local-deploy.sh --build
#
# Aliyun (default reuses /opt/shared-infra):
#   cp deploy/.env.docker.aliyun.example deploy/.env.docker
#   ./deploy/scripts/aliyun-deploy.sh --build
#
# Profiles (via COMPOSE_PROFILES in deploy/.env.docker or deploy scripts):
#   isolated-middleware — in-stack MySQL + Redis (local default)
#   shared-middleware   — reuse shared-mysql / shared-redis (Aliyun default)
#   worker-tools        — Playwright + k6 + nuclei worker image
#
# Push custom images: ./deploy/scripts/push-images.sh YOURUSER

name: ai-tp

services:
  mysql:
    profiles: ["isolated-middleware"]
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    env_file:
      - deploy/.env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_tp}
      MYSQL_USER: ${MYSQL_USER:-ai_tp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_tp_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M}
      - --innodb-log-buffer-size=${MYSQL_INNODB_LOG_BUFFER_SIZE:-16M}
      - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-ON}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}
      - --skip-mysqlx
    volumes:
      - ai_tp_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${MYSQL_PUBLISH_PORT:-3307}:3306"
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}

  redis:
    profiles: ["isolated-middleware"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ai_tp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6380}:6379"
    mem_limit: ${REDIS_MEM_LIMIT:-256m}

  api:
    image: ${AI_TP_API_IMAGE:-ai-tp-api:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    env_file:
      - deploy/.env.docker
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOB_QUEUE_BACKEND: ${JOB_QUEUE_BACKEND:-rq}
      JOB_WORKER_IN_API: "false"
      JOB_WORKER_ENABLED: "true"
      SCHEMA_BOOTSTRAP_MODE: alembic
      RUN_MIGRATIONS: "true"
      BOOTSTRAP_ADMIN_SYNC_PASSWORD: ${BOOTSTRAP_ADMIN_SYNC_PASSWORD:-false}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED:-false}
    volumes:
      - ai_tp_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    expose:
      - "8002"
    mem_limit: ${API_MEM_LIMIT:-1g}
    networks:
      - default
      - shared-infra

  worker:
    image: ${AI_TP_WORKER_IMAGE:-ai-tp-api:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: ${WORKER_DOCKER_TARGET:-runtime}
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    command: ["/entrypoint-worker.sh"]
    env_file:
      - deploy/.env.docker
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOB_QUEUE_BACKEND: ${JOB_QUEUE_BACKEND:-rq}
      JOB_WORKER_IN_API: "false"
      JOB_WORKER_ENABLED: "true"
      SCHEMA_BOOTSTRAP_MODE: alembic
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED:-false}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-}
    volumes:
      - ai_tp_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      api:
        condition: service_healthy
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    networks:
      - default
      - shared-infra

  web:
    image: ${AI_TP_WEB_IMAGE:-ai-tp-web:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Interpolation reads --env-file / project .env, NOT service env_file.
      # Aliyun host nginx already owns 8088 — set WEB_PUBLISH_PORT=8090 there.
      - "${WEB_PUBLISH_PORT:-8088}:80"
    mem_limit: ${WEB_MEM_LIMIT:-256m}

volumes:
  ai_tp_mysql:
  ai_tp_redis:
  ai_tp_data:

# Always attach api/worker so Aliyun shared-mysql/shared-redis are resolvable.
# Local deploy creates this network if missing (see local-deploy.sh).
networks:
  shared-infra:
    external: true
    name: shared-infra
